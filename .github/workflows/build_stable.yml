name: Build (Stable)

# A version tag (v1.2.3) is published as 1.2.3, 1.2, 1 and stable. Run manually,
# the chosen branch is published as stable only.
on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=stable
